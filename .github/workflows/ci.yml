name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  compatibility:
    name: Swift 6.0.3 compatibility
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify toolchain
        run: |
          swiftc --version | grep -F "Apple Swift version 6.0.3"
          test "$(xcrun --sdk macosx --show-sdk-version)" = "15.2"

      - name: Build
        run: ./build.sh

      - name: Selftest
        run: ./build/Vorssaint --selftest

      - name: Unit tests
        run: ./build.sh --test

  intel-sequoia:
    name: Intel x86_64 cross-compile & Rosetta tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Cross-compiles the x86_64 slices on the arm64 runner's SDK, then runs
      # the x86_64 test binary under Rosetta, matching how the fork builds and
      # tests on real Intel Sequoia hardware. The recorder codec preference
      # suite pins the H.264 choice the Intel slices must keep.
      - name: Unit tests (x86_64 binary under Rosetta)
        run: VORSSAINT_TARGET=x86_64-apple-macosx14.0 ./build.sh --test

      - name: Build
        run: VORSSAINT_TARGET=x86_64-apple-macosx14.0 ./build.sh

      - name: Selftest (x86_64 binary under Rosetta)
        run: file build/Vorssaint | grep -F "x86_64" && ./build/Vorssaint --selftest

  build:
    name: Build & selftest
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build
        run: ./build.sh

      - name: Selftest
        run: ./build/Vorssaint --selftest

      - name: Package DMG
        run: ./Tools/make-dmg.sh

      - name: Unit tests
        run: ./build.sh --test
